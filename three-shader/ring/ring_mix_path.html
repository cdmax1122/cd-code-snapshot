<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆环扩散与路径生长</title>
</head>
<body>
    <script type="module">
        import * as THREE from "https://unpkg.com/three@0.169.0/build/three.module.js";

        const config = {
            width: 1024,
            height: 700
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, config.width / config.height, 0.1, 100);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(config.width, config.height);
        document.body.appendChild(renderer.domElement);

        const textureLoader = new THREE.TextureLoader();
        const mapTexture = textureLoader.load('./assets/path.png');

        const geometry = new THREE.PlaneGeometry(5, 5);
        const material = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                uniform float uTime;
                uniform sampler2D uTexture;

                void main() {
                    // 圆心
                    vec2 center = vec2(0.5);

                    // 每个像素到圆心的距离
                    float dist = distance(vUv, center);

                    // 圆环宽度
                    float thickness = 0.1;

                    // 随时间扩散的半径
                    float outerRadius = fract(uTime) ;

                    // 用 smoothstep 生成柔和的圆环遮罩
                    float ring = smoothstep(outerRadius - thickness, outerRadius, dist)
                            - smoothstep(outerRadius, outerRadius + thickness, dist);

                    // 圆环颜色
                    vec3 ringColor = vec3(1.0, 0.0, 0.0);


                    // 采样路径纹理（假设路径为白色，背景透明）; fract重复10次
                    vec4 textureColor = texture2D(uTexture, fract(vUv * 10.0)); 

                    // mask = 路径区域 (用 alpha 通道)
                    float mask = textureColor.a;

                    // 沿着路径扩散 (思路上等同 if (mask === 1) effct = ring; else effect = 0)
                    float effect = ring * mask;

                    // 输出颜色
                    gl_FragColor = vec4(ringColor, effect);
                }
            `,
            uniforms: {
                uTime: { value: 0.0},
                uTexture: { value: mapTexture}
            },
            transparent: true
        });
        scene.add(new THREE.Mesh(geometry, material));

        function animate() {
            requestAnimationFrame(animate);

            material.uniforms.uTime.value += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
